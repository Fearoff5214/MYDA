# Allowlist for THIS machine (the laptop). Not committed -- each PC has its own.
#
# This file is the security boundary for everything voice can do here.
# It is an allowlist on purpose: anything not named below is refused, so a
# misheard command or a confused model cannot reach arbitrary software.

aliases:
  - "this laptop"
  - "the laptop"

# Only apps verified to exist on this machine.
apps:
  chrome: "C:/Program Files/Google/Chrome/Application/chrome.exe"
  vscode: "C:/Users/param/AppData/Local/Programs/Microsoft VS Code/Code.exe"
  notepad: "C:/Windows/System32/notepad.exe"
  calculator: "C:/Windows/System32/calc.exe"
  explorer: "explorer.exe"

# Narrower than the launch list on purpose: starting Explorer is harmless,
# killing things is not.
closable:
  - notepad
  - calculator
  - chrome

paths:
  readable:
    - "C:/Users/param/Downloads"
    - "C:/Users/param/Documents"
    - "D:/jarvis"
  # Kept deliberately tight. Never a whole drive, never a system directory.
  writable:
    - "C:/Users/param/Documents/jarvis-scratch"

limits:
  max_list_entries: 60
  max_read_chars: 4000
  max_delete_batch: 10

# Leave off. Enabling this hands voice unrestricted control of the machine,
# which defeats every allowlist above.
shell:
  enabled: false
  allowed: []
