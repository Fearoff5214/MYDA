# Supporting services for the hub. Run on the desktop:
#
#     cd infra && docker compose up -d
#
# Both bind to localhost only. The hub reaches them over the loopback
# interface, and nothing here is exposed to the tailnet or the LAN.

services:
  homeassistant:
    image: ghcr.io/home-assistant/home-assistant:stable
    container_name: jarvis-homeassistant
    restart: unless-stopped
    volumes:
      - ./homeassistant:/config
      - /etc/localtime:/etc/localtime:ro
    environment:
      - TZ=Asia/Kolkata
    # host networking lets Home Assistant discover Tuya, TP-Link and Matter
    # devices by broadcast. Without it, local discovery silently finds nothing.
    # On Docker Desktop for Windows host networking is limited; if discovery
    # fails, add devices by IP instead, or run HA on a Linux box or a Pi.
    network_mode: host

  searxng:
    image: searxng/searxng:latest
    container_name: jarvis-searxng
    restart: unless-stopped
    ports:
      - "127.0.0.1:8888:8080"
    volumes:
      - ./searxng:/etc/searxng
    environment:
      - SEARXNG_BASE_URL=http://127.0.0.1:8888/
      # JSON output is off by default; the hub needs it to read results.
      - SEARXNG_SEARCH_FORMATS=html,json
